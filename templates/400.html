{% extends "base.html" %}

{% block title %}Request could not be accepted · ResourceHub{% endblock %}
{% block page_class %}not-found-page{% endblock %}

{% block content %}
  <section class="not-found-card" aria-labelledby="request-error-title">
    <p class="eyebrow">REQUEST NOT ACCEPTED</p>
    <h1 id="request-error-title">Please reload and try again.</h1>
    <p>{{ message }}</p>
    <div class="not-found-actions"><a class="button-primary" href="{{ url_for('borrow_route') }}">Return to transactions</a></div>
  </section>
{% endblock %}
